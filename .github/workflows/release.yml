name: Release

# A version becomes a release WHEN THE OWNER ASKS, never by itself (CLAUDE.md,
# "Releases"): a tag v<version> pushed on main's commit, or Run workflow on
# main. The tag must be the commit's own version (package.json). Nothing is
# released until CI has passed on the same commit (.github/wait-for-ci.sh).
#   1. tags the commit v<version> (Run workflow) and publishes a GitHub release
#      marked Latest, its notes the CHANGELOG.md section for that version;
#   2. builds the container image and publishes it to the GitHub Container
#      Registry as ghcr.io/meltface-80/musicd-lms-remote:<version> + :latest.
# The in-app updater (lib/updater.js) reads releases/latest FIRST, so every
# version that reaches an install must come through here.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read     # to see CI's runs (.github/wait-for-ci.sh)
    steps:
      - uses: actions/checkout@v4
      - name: Only main's commit, at its own version
        run: |
          V=$(jq -r .version package.json)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "Tag $GITHUB_REF_NAME is not this commit's version (v$V)"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_REF_NAME" != main ]; then
            echo "Releases are cut from main, not $GITHUB_REF_NAME"; exit 1
          fi
      - name: Wait for CI to pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/wait-for-ci.sh "$GITHUB_SHA"

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and publish the release (once per version)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(jq -r .version package.json)
          TAG="v$V"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi
          # Notes: CHANGELOG.md's section for this version, else the body of
          # the "Release v<version>" commit (releases before the changelog).
          awk -v h="## $TAG" '$0 == h || index($0, h " ") == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > /tmp/notes.md || true
          if ! grep -q '[^[:space:]]' /tmp/notes.md; then
            SHA=$(git log --format='%H %s' | awk -v t="Release $TAG" '
              { s = substr($0, 42) }
              index(s, t) == 1 && (length(s) == length(t) || substr(s, length(t) + 1, 1) ~ /[ :—-]/) { print $1; exit }')
            [ -n "$SHA" ] && git log -1 --format='%b' "$SHA" | sed '/^Co-Authored-By:/d;/^Claude-Session:/d' > /tmp/notes.md
          fi
          if [ ! -s /tmp/notes.md ] || ! grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "MusicD LMS Remote $TAG." > /tmp/notes.md
          fi
          # Notes go through a FILE: commit bodies carry backticks, which a
          # double-quoted --notes argument would run as command substitution.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MusicD LMS Remote $TAG" \
            --notes-file /tmp/notes.md \
            --latest

  image:
    needs: [test, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Version and image name
        id: v
        run: |
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          # NAMED, not derived from the repository name: every install command
          # pulls this exact string, and a repo rename must not move it.
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/musicd-lms-remote" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Is this version already published?
        id: have
        run: |
          if docker buildx imagetools inspect "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.have.outputs.exists == 'false'

      - uses: docker/setup-buildx-action@v3
        if: steps.have.outputs.exists == 'false'

      # x86 servers, 64-bit ARM (NAS boxes, Pi 4/5, Apple silicon) and 32-bit
      # Raspberry Pi OS. The dependencies are pure JS, so the emulated builds
      # are quick.
      - name: Build and push
        if: steps.have.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=MusicD LMS Remote
            org.opencontainers.image.description=Music-discovery PWA and wall display for Lyrion Music Server
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
