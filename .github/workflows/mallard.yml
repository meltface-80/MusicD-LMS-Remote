name: Mallard (Android)

# Builds Mallard, the native Android remote in android/. Every push that
# touches it runs the core tests and builds a release APK (uploaded as a run
# artifact). Pushes to dev also publish the APK on the rolling `mallard-test`
# pre-release, so there is always one link to the newest test build. A
# pre-release is never "latest", so it never reaches the server's in-app
# updater (which reads releases/latest).
#
# Signing: with the MALLARD_KEYSTORE_BASE64 / MALLARD_KEYSTORE_PASSWORD
# secrets set, the APK is signed with that key; without them, with the public
# test key committed at android/app/mallard-debug.keystore, so each test build
# still installs over the last.

on:
  push:
    paths: ["android/**", ".github/workflows/mallard.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/mallard.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mallard-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Core tests (plain JVM)
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Release signing key (when the secrets are set)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEY_B64: ${{ secrets.MALLARD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/mallard.keystore"
            echo "MALLARD_KEYSTORE=$RUNNER_TEMP/mallard.keystore" >> "$GITHUB_ENV"
          else
            echo "No release key set: signing with the committed test key."
          fi

      - name: Build the APK
        env:
          MALLARD_KEYSTORE_PASSWORD: ${{ secrets.MALLARD_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Name it
        id: apk
        run: |
          V=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          SHA=$(git rev-parse --short HEAD)
          OUT="Mallard-$V-$SHA.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "file=android/$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: mallard-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish the test build (dev only)
        if: ${{ github.ref == 'refs/heads/dev' && github.event_name == 'push' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ steps.apk.outputs.file }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          cp "$FILE" mallard-test.apk
          if ! gh release view mallard-test > /dev/null 2>&1; then
            gh release create mallard-test --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Mallard test build" --notes "The newest Mallard test build from the dev branch."
          fi
          gh release upload mallard-test mallard-test.apk --clobber
          gh release edit mallard-test --prerelease --latest=false \
            --notes "Mallard $VERSION test build from dev @ ${GITHUB_SHA::7}. Install mallard-test.apk on an Android 8.0+ phone."
